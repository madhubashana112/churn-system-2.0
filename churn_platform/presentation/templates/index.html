<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn AI &mdash; Tenant onboarding</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>body { --accent:#4f46e5; --accent-soft:#eef2ff; --accent-ink:#312e81; }</style>
</head>
<body>
<div class="onboard">
    <div class="onboard__card">
        <p class="page-head__eyebrow">Domain-adaptive churn prediction</p>
        <h1 class="onboard__title">Register your tenant</h1>
        <p class="onboard__subtitle">
            The sector you pick decides which retention core scores your customers and
            which dashboard you land on.
        </p>

        <div class="form-error" id="onboard-error" hidden></div>

        <form id="onboard-form" novalidate>
            <div class="field">
                <label class="field__label" for="company-name">Company name</label>
                <input class="input" type="text" id="company-name" name="name"
                       placeholder="Northwind Subscription Co" autocomplete="organization" required>
            </div>

            <div class="field">
                <label class="field__label" for="sector">Sector</label>
                <select class="select" id="sector" name="sector" required>
                    <option value="SaaS">SaaS &mdash; B2B / B2C subscriptions</option>
                    <option value="Telecom">Telecom &amp; ISP &mdash; subscribers</option>
                    <option value="FinTech">FinTech &amp; Banking &mdash; accounts and wallets</option>
                </select>
            </div>

            <button type="submit" class="btn btn--primary btn--block" id="onboard-submit">
                Register &amp; continue
            </button>
        </form>

        <p class="onboard__subtitle" style="margin:1.2rem 0 0; text-align:center">
            Aliases work too: <span class="mono">isp</span>, <span class="mono">banking</span>,
            <span class="mono">subscription</span>.
        </p>
    </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
