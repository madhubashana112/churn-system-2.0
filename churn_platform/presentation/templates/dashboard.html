<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/static/js/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn AI &mdash; opening your dashboard</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>body { --accent:#4f46e5; --accent-soft:#eef2ff; }</style>
</head>
<body>
<div class="onboard">
    <div class="onboard__card" style="text-align:center">
        <div class="spinner" style="margin:0 auto 1rem"></div>
        <p class="onboard__title" id="boot-title">Opening your dashboard&hellip;</p>
        <p class="onboard__subtitle" id="boot-subtitle">
            Each sector gets its own dashboard, so we look up which one this tenant registered under.
        </p>
        <a href="/" class="btn btn--ghost" id="boot-link" hidden>Back to onboarding</a>
    </div>
</div>

<script>
    // The sector dashboards are chosen server-side from the tenant record, which
    // is the only trustworthy source: localStorage can hold a sector the tenant
    // was never registered under. This page exists purely to hand the stored
    // tenant id to that route.
    (function () {
        const tenantId = localStorage.getItem('tenant_id');
        if (tenantId) {
            window.location.replace('/dashboard?tenant_id=' + encodeURIComponent(tenantId));
            return;
        }
        document.getElementById('boot-title').textContent = 'No tenant selected';
        document.getElementById('boot-subtitle').textContent =
            'Register a tenant first — the sector you pick decides which dashboard you get.';
        document.getElementById('boot-link').hidden = false;
    })();
</script>
<script src="/static/js/account.js"></script>
</body>
</html>
